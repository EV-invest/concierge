syntax = "proto3";

package concierge.v1;

// GovernanceService — the fund's OWNERSHIP plane: who holds `Role::Owner`, and the
// consilium that must agree before a seat is taken away.
//
// WHY OWNERSHIP LIVES HERE. A seat is `users.role`, a concierge-owned fact, and the
// bridge to the money plane is one-way. Only this plane may mutate it, so only this
// plane can authorize the mutation. The money plane runs its own, separate consilium
// over its own mirrored roster — neither plane trusts the other's verdict.
//
// THE RULE. A removal passes when EITHER
//   (a) the target accepts it from their own mailbox, OR
//   (b) every owner except the target and the initiator votes to remove.
//
// Path (b) is unanimity over `owners \ {target, initiator}`. With exactly two owners
// that set is EMPTY and unanimity over it is vacuously true — which would let either
// owner expel the other unilaterally. Path (b) therefore requires at least ONE eligible
// peer voter; with two owners only path (a) exists.
//
// FLOOR. A removal may not leave fewer than TWO owners. Two suspends payouts — the
// money plane's `floor(N/2)+1` threshold is unreachable below three — but that is
// recoverable, because two owners can still admit a third. A floor of three was the
// earlier draft and it was wrong: at exactly three owners it made a bad actor
// unremovable forever, and a permanent deadlock is worse than a recoverable pause.
//
// ADMISSION IS GOVERNED TOO, and it is the reason the rest of this holds. Granting a
// seat is its own consilium: unanimity of `owners \ {initiator}`, with at least one such
// peer. Without it a bad actor mints sock puppets BEFORE opening an invoice and then
// reaches quorum legitimately — 2 honest owners plus 4 puppets is N=7, threshold 4,
// voters 6 — and snapshotting the roster cannot help, because the stuffing already
// happened. Unanimity rather than a majority, because a minority must never be able to
// grow itself into a majority.
//
// See banking's docs/CONSILIUM.md for the whole policy.
service GovernanceService {
  // The current owner roster (Owner only).
  rpc ListOwners(ListOwnersRequest) returns (OwnerList);

  // Propose removing an owner (Owner only). The initiator casts no vote — proposing is
  // not agreeing, and counting it would let two owners remove a third.
  rpc OpenOwnerRemoval(OpenOwnerRemovalRequest) returns (OwnerRemoval);

  // Withdraw a proposal the caller opened, while it is still OPEN.
  rpc CancelOwnerRemoval(CancelOwnerRemovalRequest) returns (OwnerRemoval);

  // A peer owner's vote, cast in the cabinet while signed in — this is the live
  // consilium, not an emailed link. The target and the initiator are both refused.
  rpc SubmitPeerVote(SubmitPeerVoteRequest) returns (OwnerRemoval);

  // Resign your own seat. No consilium — but the same floor applies, so the last two
  // owners cannot leave the fund without governance.
  rpc ResignOwnership(ResignOwnershipRequest) returns (OwnerList);

  rpc GetOwnerRemoval(GetOwnerRemovalRequest) returns (OwnerRemoval);
  rpc ListOwnerRemovals(ListOwnerRemovalsRequest) returns (OwnerRemovalList);

  // Propose GRANTING a seat (Owner only). The candidate does not vote — they are not
  // yet an owner — and neither does the initiator, so the voters are every OTHER
  // current owner and all of them must agree. A lone owner cannot open one at all.
  //
  // This is the only way `Role::Owner` is granted: UserDirectory.SetRole refuses it
  // outside an executed admission.
  rpc OpenOwnerAdmission(OpenOwnerAdmissionRequest) returns (OwnerAdmission);

  // Withdraw an admission the caller opened, while it is still OPEN.
  rpc CancelOwnerAdmission(CancelOwnerAdmissionRequest) returns (OwnerAdmission);

  // A peer owner's vote on an admission, cast in the cabinet while signed in. One
  // REJECT ends it: admission passes only on unanimity.
  rpc SubmitAdmissionVote(SubmitAdmissionVoteRequest) returns (OwnerAdmission);

  rpc GetOwnerAdmission(GetOwnerAdmissionRequest) returns (OwnerAdmission);
  rpc ListOwnerAdmissions(ListOwnerAdmissionsRequest) returns (OwnerAdmissionList);

  // Propose PERMANENTLY suspending a user (Owner only). The half of the old
  // DisableUser verb that is not an emergency: UserDirectory.HoldUser freezes the
  // account now and lapses in 24h, and this is what makes it stay.
  //
  // A reason is required. It is what the other owners are voting on, and a decision to
  // freeze somebody's account with no stated cause cannot be reviewed afterwards.
  rpc OpenUserSuspension(OpenUserSuspensionRequest) returns (UserProposal);

  // Propose lifting a suspension THE OWNERS imposed (Owner only). It exists because
  // UserDirectory.ReinstateUser refuses those: without this RPC the consilium's verdict
  // would be either permanent or reversible by any one admin, and both are wrong.
  //
  // A hold needs nothing from here — ReinstateUser lifts one in a single act.
  rpc OpenUserReinstatement(OpenUserReinstatementRequest) returns (UserProposal);

  // Propose granting Role::Admin (Owner only). UserDirectory.SetRole refuses that role
  // in the granting direction and names this, for the same reason it already refuses
  // `owner`: an operator who can appoint operators can appoint accomplices, and the
  // admin seat carries every identity mutation except role granting.
  //
  // Taking the role away is NOT here and stays one act on purpose — containing a rogue
  // operator must never be the slower path.
  rpc OpenAdminAdmission(OpenAdminAdmissionRequest) returns (UserProposal);

  // Withdraw a user proposal the caller opened, while it is still OPEN.
  rpc CancelUserProposal(CancelUserProposalRequest) returns (UserProposal);

  // An owner's vote on a user proposal. Unlike the OWNER consilia this passes on a
  // MAJORITY of the snapshotted voters rather than unanimity — see UserProposal.
  rpc SubmitUserProposalVote(SubmitUserProposalVoteRequest) returns (UserProposal);

  rpc GetUserProposal(GetUserProposalRequest) returns (UserProposal);
  rpc ListUserProposals(ListUserProposalsRequest) returns (UserProposalList);

  // The live consilium feed (Owner only). Emits a tick whenever the governance
  // revision moves, plus a periodic heartbeat. ONE revision covers removals,
  // admissions and user proposals alike, so a single subscription follows the whole
  // governance surface.
  //
  // A tick carries a REVISION, never a tally: the client refetches the authoritative
  // snapshot when it moves, so a stale or replayed frame can never render a wrong
  // count. The server also re-reads on an interval, so correctness never depends on an
  // in-process broadcast reaching every replica.
  rpc WatchGovernance(WatchGovernanceRequest) returns (stream GovernanceTick);
}

// OwnerRemovalApprovalService — the surface the TARGET of a removal reaches from their
// mailbox. Mounted outside the user-auth layer, like AuthService: the emailed token is
// the credential, and the person clicking may not be signed in.
//
// The read is side-effect free because mail scanners issue automatic requests for every
// URL in a message; accepting requires the secret code from the same mail.
service OwnerRemovalApprovalService {
  // The redacted invitation behind an emailed token. Unknown, expired, spent and
  // wrong-state tokens all return the same NOT_FOUND.
  rpc GetInvitation(GetRemovalInvitationRequest) returns (OwnerRemovalInvitation);

  // The target accepting — or refusing — their own removal. Five failed code attempts
  // burn the token permanently.
  rpc SubmitSelfDecision(SubmitSelfDecisionRequest) returns (SubmitSelfDecisionResponse);
}

// MailRelayService — the one seam over which the MONEY plane asks this plane to send a
// governance mail, because this plane owns the only mailer (lettre + the delivery queue
// + backoff + the daily budget) and standing up a second one would duplicate all of it.
//
// Authenticated by the shared banking↔concierge service secret, compared in constant
// time, and mounted outside the user-auth layer exactly as the lifecycle bridge is.
//
// The payload is TYPED, never rendered HTML: this plane renders it. A compromised money
// plane must not be able to put arbitrary markup into an owner's mailbox.
//
// WHO MAY RECEIVE ONE is decided per KIND, and the default is the strict one. The
// consilium kinds — the three payout kinds and PAYMENT_APPROVAL — speak to the
// consilium, so they go to a seated owner and to nobody else — that rule is what stops a
// compromised money plane aiming a concierge-branded security mail at any address on
// the platform. PAYMENT_CONSENT cannot use it: consenting to a
// transfer of your own money has nothing to do with holding a seat. It gets its own rule,
// narrower in the dimension that matters — the recipient must BE the payment's subject,
// named in the typed payload — so the surface widens by exactly one person per message
// rather than to everyone. The fee policy pair follows the same split: FEE_POLICY_APPROVAL
// is a consilium kind (a seated owner, verified address), FEE_POLICY_NOTICE is addressed by
// identity to the one investor it is about.
//
// This path deliberately bypasses notification preferences. `NotificationService.Emit`
// is opt-out on both channels, and a security mail that a subscriber can silently
// switch off is not a security mail.
service MailRelayService {
  // Enqueue one governance mail. Idempotent by `dedupe_key`, so an at-least-once
  // caller may retry without sending twice.
  rpc SendGovernanceMail(SendGovernanceMailRequest) returns (SendGovernanceMailResponse);
}

enum OwnerRemovalState {
  OWNER_REMOVAL_STATE_UNSPECIFIED = 0;
  OWNER_REMOVAL_STATE_OPEN = 1;
  // The target accepted, or the peers were unanimous. The seat is already gone.
  OWNER_REMOVAL_STATE_EXECUTED = 2;
  // The target refused and at least one peer withheld, or a peer voted to keep.
  OWNER_REMOVAL_STATE_REJECTED = 3;
  OWNER_REMOVAL_STATE_EXPIRED = 4;
  OWNER_REMOVAL_STATE_CANCELLED = 5;
  // Passed, but the seat could not be taken (e.g. the floor would be breached by the
  // time it resolved, or the initiator had themselves lost ownership).
  OWNER_REMOVAL_STATE_VOID = 6;
}

enum RemovalVote {
  REMOVAL_VOTE_UNSPECIFIED = 0;
  REMOVAL_VOTE_PENDING = 1;
  // Remove the target.
  REMOVAL_VOTE_REMOVE = 2;
  // Keep the target. One of these ends path (b), which requires unanimity.
  REMOVAL_VOTE_KEEP = 3;
}

// The six states a proposal of either kind can be in. A separate enum from
// OwnerRemovalState only because proto enum VALUES share one namespace per package;
// the states themselves are identical, and the domain models them with one type.
enum OwnerAdmissionState {
  OWNER_ADMISSION_STATE_UNSPECIFIED = 0;
  OWNER_ADMISSION_STATE_OPEN = 1;
  // Every other owner agreed. The seat has already been granted.
  OWNER_ADMISSION_STATE_EXECUTED = 2;
  // At least one owner voted to reject.
  OWNER_ADMISSION_STATE_REJECTED = 3;
  OWNER_ADMISSION_STATE_EXPIRED = 4;
  OWNER_ADMISSION_STATE_CANCELLED = 5;
  // Passed, but the seat could not be granted — the initiator had themselves lost
  // ownership, or the candidate had already been seated by another admission.
  OWNER_ADMISSION_STATE_VOID = 6;
}

// Deliberately its own enum rather than a reuse of RemovalVote: "remove/keep" and
// "admit/reject" are different questions, and a surface that renders the wrong verb on
// a governance vote is a surface that gets a vote cast by mistake.
enum AdmissionVote {
  ADMISSION_VOTE_UNSPECIFIED = 0;
  ADMISSION_VOTE_PENDING = 1;
  // Grant the candidate a seat.
  ADMISSION_VOTE_ADMIT = 2;
  // Refuse. One of these ends the admission, which passes only on unanimity.
  ADMISSION_VOTE_REJECT = 3;
}

message Owner {
  string user_id = 1;
  // Masked on every surface a non-owner can reach.
  string email = 2;
  string display_name = 3;
  int64 owner_since = 4;
}

message OwnerList {
  repeated Owner items = 1;
  // Below three, the money plane can no longer reach its payout threshold.
  bool below_payout_floor = 2;
}

message RemovalPeer {
  string user_id = 1;
  string email = 2;
  RemovalVote vote = 3;
  int64 voted_at = 4;
}

message OwnerRemoval {
  string id = 1;
  OwnerRemovalState state = 2;
  string target_user_id = 3;
  string target_email = 4;
  string initiator_user_id = 5;
  string initiator_email = 6;
  // Why, in the initiator's words. Shown to the target and to every peer.
  string reason = 7;
  // Every owner except the target and the initiator, with their answers. Empty means
  // path (b) is unavailable and only the target's own acceptance can carry this.
  repeated RemovalPeer peers = 8;
  // How the target answered from their mailbox.
  RemovalVote target_decision = 9;
  int64 target_decided_at = 10;
  bool target_notified = 11;
  // Owners at open, and the count that would remain. The floor is checked at open AND
  // at execution, because the roster can move underneath an open proposal.
  uint32 owner_count = 12;
  int64 created_at = 13;
  int64 expires_at = 14;
  int64 decided_at = 15;
  string void_reason = 16;
  uint64 version = 17;
}

message OwnerRemovalList {
  repeated OwnerRemoval items = 1;
}

message AdmissionPeer {
  string user_id = 1;
  string email = 2;
  AdmissionVote vote = 3;
  int64 voted_at = 4;
}

message OwnerAdmission {
  string id = 1;
  OwnerAdmissionState state = 2;
  string candidate_user_id = 3;
  string candidate_email = 4;
  string initiator_user_id = 5;
  string initiator_email = 6;
  // Why, in the initiator's words. Shown to every voter.
  string reason = 7;
  // Every owner except the initiator, with their answers. Never empty: an admission
  // with nobody to agree is refused at open rather than left open and unpassable.
  repeated AdmissionPeer peers = 8;
  // Owners at open. The initiator is counted but does not vote.
  uint32 owner_count = 9;
  int64 created_at = 10;
  int64 expires_at = 11;
  int64 decided_at = 12;
  string void_reason = 13;
  uint64 version = 14;
}

message OwnerAdmissionList {
  repeated OwnerAdmission items = 1;
}

message OpenOwnerAdmissionRequest {
  // The user to seat. Must not already be an owner.
  string candidate_user_id = 1;
  string reason = 2;
}

message CancelOwnerAdmissionRequest {
  string admission_id = 1;
}

message SubmitAdmissionVoteRequest {
  string admission_id = 1;
  AdmissionVote vote = 2;
}

message GetOwnerAdmissionRequest {
  string admission_id = 1;
}

message ListOwnerAdmissionsRequest {
  // 0 means the server default. Includes closed proposals — nothing is deleted.
  uint32 limit = 1;
}

// What a UserProposal decides. Three kinds share one message because all three are the
// same question — "do the owners agree to change this person's standing?" — differing
// only in what the verdict writes.
enum UserProposalKind {
  USER_PROPOSAL_KIND_UNSPECIFIED = 0;
  // Freeze the subject until the owners say otherwise.
  USER_PROPOSAL_KIND_SUSPENSION = 1;
  // Lift a suspension the owners themselves imposed.
  USER_PROPOSAL_KIND_REINSTATEMENT = 2;
  // Grant Role::Admin.
  USER_PROPOSAL_KIND_ADMIN_ADMISSION = 3;
}

// The six states, again as their own enum: proto enum VALUES share one namespace per
// package, so the identical states have to be spelled three times even though the
// domain models them with one type.
enum UserProposalState {
  USER_PROPOSAL_STATE_UNSPECIFIED = 0;
  USER_PROPOSAL_STATE_OPEN = 1;
  // The threshold was met and the effect has already been applied.
  USER_PROPOSAL_STATE_EXECUTED = 2;
  // Enough owners voted AGAINST that the threshold can no longer be reached.
  USER_PROPOSAL_STATE_REJECTED = 3;
  USER_PROPOSAL_STATE_EXPIRED = 4;
  USER_PROPOSAL_STATE_CANCELLED = 5;
  // Passed, but the effect could not be applied — the initiator had lost their seat,
  // the owners who carried it had lost theirs, or the subject's standing had already
  // moved (they hold an owner seat, they are already an admin, the suspension being
  // lifted is no longer the owners').
  USER_PROPOSAL_STATE_VOID = 6;
}

// Deliberately NEUTRAL verbs, where the owner consilia use remove/keep and
// admit/reject. Three kinds share this vote, so a kind-specific verb would only mean
// something read against UserProposal.kind — and a vocabulary that is correct only when
// cross-referenced is one that eventually gets rendered wrong. The kind-specific verb
// belongs on the SURFACE, which knows the kind; this is which way the voter pushed.
enum ProposalVote {
  PROPOSAL_VOTE_UNSPECIFIED = 0;
  PROPOSAL_VOTE_PENDING = 1;
  // Carry the proposal.
  PROPOSAL_VOTE_FOR = 2;
  // Block it.
  PROPOSAL_VOTE_AGAINST = 3;
}

message UserProposalPeer {
  string user_id = 1;
  string email = 2;
  ProposalVote vote = 3;
  int64 voted_at = 4;
}

// The owners' verdict over one PERSON's standing.
//
// It passes on a MAJORITY of the snapshotted voters, not the unanimity the OWNER
// consilia demand, and the difference is deliberate. Unanimity guards the owner roster
// because a minority able to add owners by majority grows itself into a majority.
// Neither thing decided here has that property: `admin` cannot vote in any consilium
// and cannot be granted `owner`, and a suspension is defensive and reversible by the
// same body. Against that, unanimity here would COST safety — a hold lapses in 24h, so
// ratifying one races a clock, and under unanimity one unreachable owner does not delay
// the verdict, they decide it by releasing a compromised account at the deadline.
//
// What is preserved is the property that matters: the initiator is excluded from the
// voter set and the threshold is at least one, so no single actor ever acts alone.
message UserProposal {
  string id = 1;
  UserProposalKind kind = 2;
  UserProposalState state = 3;
  // Any user — NOT necessarily an owner. That is the difference from OwnerAdmission,
  // and the reason none of its roster checks have an analogue here.
  string subject_user_id = 4;
  string subject_email = 5;
  string initiator_user_id = 6;
  string initiator_email = 7;
  // Why, in the initiator's words. Required, and shown to every voter.
  string reason = 8;
  // Every owner except the initiator, with their answers. Never empty: a proposal with
  // nobody to agree is refused at open rather than left open and unpassable.
  repeated UserProposalPeer peers = 9;
  // Owners at open. The initiator is counted but does not vote.
  uint32 owner_count = 10;
  // How many of `peers` must vote FOR, frozen at open — so a surface shows the bar this
  // proposal is actually measured against, not one re-derived from a roster that moved.
  uint32 threshold = 11;
  int64 created_at = 12;
  int64 expires_at = 13;
  int64 decided_at = 14;
  string void_reason = 15;
  uint64 version = 16;
}

message UserProposalList {
  repeated UserProposal items = 1;
}

message OpenUserSuspensionRequest {
  string user_id = 1;
  // REQUIRED — it is what the other owners are voting on.
  string reason = 2;
}

message OpenUserReinstatementRequest {
  string user_id = 1;
  string reason = 2;
}

message OpenAdminAdmissionRequest {
  string user_id = 1;
  string reason = 2;
}

message CancelUserProposalRequest {
  string proposal_id = 1;
}

message SubmitUserProposalVoteRequest {
  string proposal_id = 1;
  ProposalVote vote = 2;
}

message GetUserProposalRequest {
  string proposal_id = 1;
}

message ListUserProposalsRequest {
  // 0 means the server default. Includes closed proposals — nothing is deleted.
  uint32 limit = 1;
  // UNSPECIFIED lists every kind.
  UserProposalKind kind = 2;
}

message ListOwnersRequest {}

message OpenOwnerRemovalRequest {
  string target_user_id = 1;
  string reason = 2;
}

message CancelOwnerRemovalRequest {
  string removal_id = 1;
}

message SubmitPeerVoteRequest {
  string removal_id = 1;
  RemovalVote vote = 2;
}

message ResignOwnershipRequest {
  // Typed confirmation, so a resignation cannot be a stray click. The server checks it
  // equals the caller's own email.
  string confirm_email = 1;
}

message GetOwnerRemovalRequest {
  string removal_id = 1;
}

message ListOwnerRemovalsRequest {
  // 0 means the server default. Includes closed proposals — nothing is deleted.
  uint32 limit = 1;
}

message WatchGovernanceRequest {}

message GovernanceTick {
  // Monotonic across the whole governance surface. Refetch when it moves.
  uint64 revision = 1;
  // Unix seconds the tick was produced, so a client can tell a live stream from a
  // wedged one.
  int64 at = 2;
  // True for the periodic keepalive, which carries the current revision unchanged.
  bool heartbeat = 3;
}

message GetRemovalInvitationRequest {
  string token = 1;
}

// What the TARGET is shown before answering. No peer identities, no vote breakdown —
// knowing exactly who voted to remove you, before you answer, is not information this
// flow needs to hand over.
message OwnerRemovalInvitation {
  string removal_id = 1;
  OwnerRemovalState state = 2;
  string initiator_email = 3;
  string target_email = 4;
  string reason = 5;
  int64 created_at = 6;
  int64 expires_at = 7;
  RemovalVote decision = 8;
  uint32 attempts_remaining = 9;
}

message SubmitSelfDecisionRequest {
  string token = 1;
  string code = 2;
  // REMOVE accepts the expulsion; KEEP refuses it.
  RemovalVote vote = 3;
  string client_ip = 4;
  string user_agent = 5;
}

message SubmitSelfDecisionResponse {
  OwnerRemovalInvitation invitation = 1;
  bool decided = 2;
}

// The typed governance mails this plane knows how to render.
enum GovernanceMailKind {
  GOVERNANCE_MAIL_KIND_UNSPECIFIED = 0;
  // The money plane asking an owner to approve a revenue payout.
  GOVERNANCE_MAIL_KIND_PAYOUT_APPROVAL = 1;
  // The money plane telling the owners a payout was decided, executed or failed.
  GOVERNANCE_MAIL_KIND_PAYOUT_OUTCOME = 2;
  // The money plane warning the owners that a token burned on failed code attempts.
  GOVERNANCE_MAIL_KIND_APPROVAL_TOKEN_BURNED = 3;
  // The money plane asking ONE user to consent to a payment that moves THEIR money.
  //
  // The only kind here that is not addressed to the consilium, and therefore the only
  // one whose recipient rule is IDENTITY rather than role: an ordinary investor
  // consents to their own transfer, and no seat is involved. See PaymentConsentMail.
  GOVERNANCE_MAIL_KIND_PAYMENT_CONSENT = 4;
  // The money plane asking an owner to approve a PAYMENT whose source is fund-owned
  // money — the consilium counterpart of PAYMENT_CONSENT. Addressed to a seated owner
  // under the same rule as the payout kinds; what differs is only what the mail
  // describes: two ends of a transfer in words, not a rail and an address. See
  // PaymentApprovalMail for why the payout template cannot carry it.
  GOVERNANCE_MAIL_KIND_PAYMENT_APPROVAL = 5;
  // The money plane asking an owner to approve NEW FEE TERMS for a fund — the consilium
  // over the price every investor in that fund pays. Addressed like PAYMENT_APPROVAL: a
  // seated owner at a verified address, because the mail carries a link and the code
  // that arms it. See FeePolicyApprovalMail.
  GOVERNANCE_MAIL_KIND_FEE_POLICY_APPROVAL = 6;
  // The money plane telling ONE investor that the fee terms of a fund they hold are
  // changing. Addressed by IDENTITY like PAYMENT_CONSENT — the recipient must BE the
  // investor the payload names — and, like a consent, it leaves an in-app trace. It asks
  // for nothing and carries no code: it is notice. See FeePolicyNoticeMail.
  GOVERNANCE_MAIL_KIND_FEE_POLICY_NOTICE = 7;
}

message SendGovernanceMailRequest {
  GovernanceMailKind kind = 1;
  // Concierge canonical user id of the recipient. The address is resolved HERE, from
  // the identity record, so the money plane cannot redirect a governance mail.
  string user_id = 2;
  // Idempotency key. The same key never sends twice.
  string dedupe_key = 3;
  // Typed fields the template consumes. Escaped at render; never interpreted as markup.
  PayoutApprovalMail payout_approval = 4;
  PayoutOutcomeMail payout_outcome = 5;
  PaymentConsentMail payment_consent = 6;
  PaymentApprovalMail payment_approval = 7;
  FeePolicyApprovalMail fee_policy_approval = 8;
  FeePolicyNoticeMail fee_policy_notice = 9;
}

message PayoutApprovalMail {
  string consilium_id = 1;
  string initiator_email = 2;
  string network = 3;
  string address = 4;
  string amount = 5;
  string memo = 6;
  string payload_hash = 7;
  uint32 threshold = 8;
  uint32 owner_count = 9;
  int64 expires_at = 10;
  // Absolute URL of the approval page, carrying the opaque token.
  string approval_url = 11;
  // The secret code the owner types on that page. Held only until the mail is sent,
  // then cleared from the delivery row.
  string code = 12;
}

// How a consilium ended — over a revenue payout, over a payment, or over a fund's fee
// terms — and, under APPROVAL_TOKEN_BURNED, that one of its tokens burned.
//
// ONE message for three subjects, additively. The burn notice already rides this shape
// under its own kind, so a payment consilium's outcome and burn ride it too, and so do a
// fee-policy consilium's, rather than each growing a message of their own: `network` +
// `address` describe a payout, `source` + `destination` (+ `tier`, `reason`) describe a
// payment, `fund` + `proposed` (+ `current`, `reason`) describe fee terms, and the
// renderer switches on which description is filled. A caller fills exactly one and
// leaves the other two empty.
message PayoutOutcomeMail {
  string consilium_id = 1;
  // APPROVED / REJECTED / EXPIRED / CANCELLED / EXECUTED / EXECUTION_FAILED, or
  // TOKEN_BURNED under the burn kind.
  string outcome = 2;
  // The payout pair. Empty for a payment.
  string network = 3;
  string address = 4;
  string amount = 5;
  string detail = 6;
  // The payment tuple. Empty for a payout. Same rules as PaymentApprovalMail: `tier`
  // is the closed set, `source` and `destination` are words a person recognises, and
  // `reason` is the operator's own text, shown attributed and refused if it carries a
  // control character.
  string tier = 7;
  string source = 8;
  string destination = 9;
  string reason = 10;
  // The fee terms description. Empty for a payout and for a payment. Same rules as
  // FeePolicyApprovalMail: `fund` is words a person recognises and may not carry a
  // link, `current` is absent when the fund charged nothing (a real state, not a
  // missing field), `proposed` is required, and `reason` — the operator's words, shown
  // attributed — is empty under the burn kind.
  string fund = 11;
  FeeTerms current = 12;
  FeeTerms proposed = 13;
}

// An owner asked to approve a payment of fund-owned money.
//
// WHY NOT PayoutApprovalMail. That template opens with "a request to pay fund revenue
// out on-chain" and labels its middle rows Network and Destination address. A payment
// is a transfer between two claims the platform holds — `Piggybank → Revenue`, or into a
// service's pooled funds, or off the platform — and rendering it through the payout
// copy would mail the whole roster a sentence naming the wrong claim and the wrong rail
// on a money move they are being asked to authorize. The one thing an approval mail
// must do is describe correctly what is being approved, so a payment gets its own.
//
// The recipient rule is the payout one: a seated owner, resolved from the identity
// record, and nobody else. Field rules are PaymentConsentMail's — every string is
// bounded in bytes and refused if it carries a control character, `tier` is a closed
// set, and `reason` is required and rendered attributed to the operator who typed it.
message PaymentApprovalMail {
  string consilium_id = 1;
  string payment_id = 2;
  string initiator_email = 3;
  // internal | service | external.
  string tier = 4;
  // Where the money leaves from, in words a person recognises (not an account id).
  string source = 5;
  // Where it lands, in words a person recognises.
  string destination = 6;
  string amount = 7;
  // Why the payment was opened, in the operator's words. Required.
  string reason = 8;
  string payload_hash = 9;
  uint32 threshold = 10;
  uint32 owner_count = 11;
  int64 expires_at = 12;
  // Absolute URL of the approval page, carrying the opaque token.
  string approval_url = 13;
  // The secret code the owner types on that page. Held only until the mail is sent,
  // then cleared from the delivery row.
  string code = 14;
}

// One user's consent to a payment that moves their own money.
//
// WHY subject_user_id EXISTS BESIDE SendGovernanceMailRequest.user_id. Every other kind
// is addressed to a fund owner, and "is this recipient an owner?" is a fact this plane
// holds independently of anything the money plane says. This kind has no such fact to
// check against: any user may consent to their own transfer, so "is this the right
// recipient?" is unanswerable from the addressing field alone. So the money plane must
// state, in the TYPED payload, whose money is moving — and the relay refuses unless the
// user it is being asked to write to IS that person. A caller that fans one consent out
// to a second mailbox has to contradict itself in the same message to do it.
//
// It is a redundancy on purpose. The address is still resolved HERE from the identity
// record and never taken from either field.
message PaymentConsentMail {
  string payment_id = 1;
  // Concierge canonical id of the user whose money moves. MUST equal the request's
  // user_id; the relay refuses the mail otherwise.
  string subject_user_id = 2;
  // The operator who opened the payment. Shown so the subject knows who is asking.
  string initiator_email = 3;
  // internal | service | external. A closed set: an unknown tier is a bug in the money
  // plane, not a string to render at a person deciding whether to part with money.
  string tier = 4;
  // Where the money leaves from, in words a person recognises (not an account id).
  string source = 5;
  // Where it lands, in words a person recognises.
  string destination = 6;
  string amount = 7;
  // Why the payment was opened, written by the operator and shown to the subject
  // VERBATIM. Required — a consent request with no stated reason is one nobody can
  // judge. Rendered under its own label so it never reads as a platform statement, and
  // refused outright if it carries a control character: the text part of a mail is not
  // escaped, so a newline here would forge the Amount/To lines this mail exists to show.
  string reason = 8;
  string payload_hash = 9;
  int64 expires_at = 10;
  // Absolute URL of the consent page, carrying the opaque token.
  string approval_url = 11;
  // The secret code the subject types on that page.
  string code = 12;
}

// One set of fee terms, as the money plane's `FeePolicy` spells them: basis points and
// two closed vocabularies. Rendered HERE as percentages and words — the money plane
// never hands this plane a pre-rendered "2.5%", because a string it renders is a string
// it can make say anything. Every `_bps` is refused above 10 000 (100%), and `basis` and
// `crystallization` are refused outside their closed sets: an unknown word means the two
// planes disagree about what the terms ARE, which is a rejected call, not a line of mail.
message FeeTerms {
  // Annual management fee, in basis points of `basis`.
  uint32 management_bps = 1;
  // Performance fee over the high-water mark, in basis points of the gain.
  uint32 performance_bps = 2;
  // Annual hurdle the gain must clear before the performance fee is due. 0 = none.
  uint32 hurdle_bps = 3;
  // invested_capital | market_value — what the management fee is charged on.
  string basis = 4;
  // monthly | quarterly | semi_annual | annual — how often the performance fee
  // crystallizes.
  string crystallization = 5;
}

// An owner asked to approve new fee terms for a fund.
//
// Shaped like PaymentApprovalMail — a seated owner, a verified address, the operator's
// reason set apart as theirs, a link on our origin and the code that arms it — and it
// describes what an owner must actually be able to check: the terms in force NOW beside
// the terms PROPOSED, field by field. A fee change is a change to the price of every
// investor in the fund, and an approval mail that showed only the new number would have
// the owner approve a difference they cannot see.
message FeePolicyApprovalMail {
  string consilium_id = 1;
  string initiator_email = 2;
  // The fund whose terms change, in words a person recognises (not a service id).
  string fund = 3;
  // The terms in force today. Absent when the fund charges nothing yet — a product with
  // no policy charges no fee, so "none" is a real current state, not a missing field.
  FeeTerms current = 4;
  // The terms proposed. Required.
  FeeTerms proposed = 5;
  // Why, in the operator's words. Required, and rendered attributed to them.
  string reason = 6;
  string payload_hash = 7;
  uint32 threshold = 8;
  uint32 owner_count = 9;
  int64 expires_at = 10;
  // Absolute URL of the approval page, carrying the opaque token.
  string approval_url = 11;
  // The secret code the owner types on that page. Held only until the mail is sent,
  // then cleared from the delivery row.
  string code = 12;
}

// One investor told that the fee terms of a fund they hold are changing.
//
// `subject_user_id` exists beside SendGovernanceMailRequest.user_id for the reason
// PaymentConsentMail gives: no seat is involved, so the only fact this plane can hold
// the money plane to is that the person it is writing to IS the person the notice is
// about. A caller that fans one investor's notice out to a second mailbox has to
// contradict itself in the same message to do it.
//
// No code and no decision: the terms were set — by the operator within the house terms,
// or by the owners' consilium beyond them — and this is the investor being told before
// they take effect, with the same notice either way. `link` is a CABINET-RELATIVE path —
// the money plane names no host at all; this plane hangs it off its own cabinet origin.
message FeePolicyNoticeMail {
  // Concierge canonical id of the investor. MUST equal the request's user_id; the relay
  // refuses the mail otherwise.
  string subject_user_id = 1;
  // The fund whose terms change, in words a person recognises.
  string fund = 2;
  // The terms in force until `effective_at`. Absent when the fund charged nothing.
  FeeTerms current = 3;
  // The terms that apply from `effective_at`. Required.
  FeeTerms proposed = 4;
  // Unix seconds the new terms take effect.
  int64 effective_at = 5;
  // Cabinet-relative path of the page showing the full terms, e.g. `/funds/qn/fees`.
  // Must start with a single `/`; empty means the cabinet's front page.
  string link = 6;
}

message SendGovernanceMailResponse {
  // False when `dedupe_key` had already been accepted.
  bool enqueued = 1;
}
